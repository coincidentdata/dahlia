[project]
name = "dahlia-cad"
version = "0.1.1"
description = "Python tools for models to work in industry CAD software, starting with SOLIDWORKS."
readme = "README.md"
license = "LicenseRef-Dahlia-Community-1.0"
license-files = ["LICENSE"]
authors = [
    { name = "Coincident Data", email = "hello@coincidentdata.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
dahlia-export = "dahlia.export_cli:main"

[project.urls]
Homepage = "https://coincidentdata.com"
Repository = "https://github.com/coincidentdata/dahlia"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.build-backend]
module-name = "dahlia"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"
